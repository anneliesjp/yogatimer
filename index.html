<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Minimal Yoga Timer</title>

<style>
  :root{
    --size: min(70vw, 520px);
    --stroke: 10;
    --dot: 34px;
    --circ: 1696.46;
  }

  *{box-sizing:border-box}

  html, body{
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:white;
  }

  body{
    background: url("background.jpg") center / cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  @media (max-width: 760px), (orientation: portrait){
    body{ background-image:url("background-iphone.png"); }
  }

  :fullscreen body,
  body:fullscreen{
    background-image:url("background-iphone.png");
  }

  .duration-picker{
    position:fixed;
    top:calc(16px + env(safe-area-inset-top));
    left:calc(16px + env(safe-area-inset-left));
    z-index:10;
    display:flex;
    gap:4px;
    padding:5px;
    border-radius:999px;
    background:rgba(255,255,255,0.13);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    opacity:.68;
  }

  .duration-picker button{
    appearance:none;
    border:0;
    border-radius:999px;
    padding:5px 7px;
    background:transparent;
    color:white;
    font-size:11px;
    font-weight:500;
    cursor:pointer;
    opacity:.82;
  }

  .duration-picker button.active{
    background:rgba(255,255,255,0.28);
    opacity:1;
  }

  .top-controls{
    position:fixed;
    top:calc(16px + env(safe-area-inset-top));
    right:calc(16px + env(safe-area-inset-right));
    z-index:10;
    display:flex;
    gap:8px;
  }

  .mini-btn{
    appearance:none;
    border:0;
    min-width:34px;
    height:34px;
    border-radius:999px;
    padding:0 10px;
    background:rgba(255,255,255,0.13);
    color:white;
    font-size:12px;
    cursor:pointer;
    opacity:.72;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }

  .mini-btn.active{
    background:rgba(255,255,255,0.30);
    opacity:.92;
  }

  :fullscreen .top-controls,
  :fullscreen .duration-picker{
    opacity:.18;
  }

  .timer{
    position:relative;
    width:var(--size);
    height:var(--size);
  }

  svg{
    width:100%;
    height:100%;
    transform:rotate(-90deg);
  }

  .track{
    fill:none;
    stroke:rgba(255,255,255,0.2);
    stroke-width:var(--stroke);
  }

  .progress{
    fill:none;
    stroke:white;
    stroke-width:var(--stroke);
    stroke-dasharray:var(--circ);
    stroke-dashoffset:var(--circ);
  }

  .dot-orbit{
    position:absolute;
    inset:0;
    transform:rotate(0deg);
  }

  .dot{
    width:var(--dot);
    height:var(--dot);
    background:white;
    border-radius:50%;
    position:absolute;
    top:calc(var(--dot) / -2);
    left:calc(50% - var(--dot)/2);
  }

  .center{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  #time{
    width:4.55ch;
    text-align:left;
    font-size:clamp(60px, 10vw, 100px);
    font-weight:300;
    letter-spacing:-0.04em;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum";
    line-height:1;
  }

  .btn{
    position:absolute;
    bottom:-95px;
    left:50%;
    transform:translateX(-50%);
    width:48px;
    height:48px;
    border-radius:50%;
    background:white;
    color:#a24a7a;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border:0;
    box-shadow:0 10px 28px rgba(66,26,64,.12);
  }

  .play{
    width:0;height:0;
    border-top:10px solid transparent;
    border-bottom:10px solid transparent;
    border-left:16px solid currentColor;
    margin-left:4px;
  }

  .pause{ display:flex; gap:6px; }

  .pause span{
    width:5px;
    height:18px;
    background:currentColor;
    border-radius:3px;
  }

  @media(max-width:760px){
    :root{
      --size:min(78vw, 430px);
      --dot:30px;
      --stroke:9;
    }

    .duration-picker{
      max-width:calc(100vw - 118px);
      flex-wrap:wrap;
      border-radius:14px;
      gap:2px;
    }

    .duration-picker button{
      font-size:10px;
      padding:4px 5px;
    }

    .btn{
      bottom:-78px;
      width:44px;
      height:44px;
    }

    #time{
      font-size:clamp(58px, 15vw, 86px);
    }
  }
</style>
</head>

<body>

<div class="duration-picker" aria-label="Select timer duration">
  <button data-min="10">10</button>
  <button data-min="15">15</button>
  <button data-min="20">20</button>
  <button data-min="25">25</button>
  <button data-min="30" class="active">30</button>
  <button data-min="35">35</button>
  <button data-min="40">40</button>
  <button data-min="45">45</button>
</div>

<div class="top-controls">
  <button class="mini-btn" id="chime" aria-label="Toggle minute chime" title="Minute chime">♡</button>
  <button class="mini-btn" id="fs" aria-label="Fullscreen">full</button>
</div>

<div class="timer">
  <svg viewBox="0 0 600 600">
    <circle class="track" cx="300" cy="300" r="270"/>
    <circle class="progress" id="progress" cx="300" cy="300" r="270"/>
  </svg>

  <div class="dot-orbit" id="orbit"><div class="dot"></div></div>
  <div class="center"><div id="time">30:00</div></div>

  <button class="btn" id="btn" aria-label="Start timer">
    <div class="play"></div>
  </button>
</div>

<script>
let TOTAL = 30 * 60;
const CIRC = 2 * Math.PI * 270;

let running = false;
let remaining = TOTAL;
let last = performance.now();
let chimeOn = false;
let audioCtx = null;
let lastWholeMinuteElapsed = 0;

const timeEl = document.getElementById("time");
const progress = document.getElementById("progress");
const orbit = document.getElementById("orbit");
const btn = document.getElementById("btn");
const chimeBtn = document.getElementById("chime");
const durationButtons = document.querySelectorAll(".duration-picker button");

function pad(n){ return String(n).padStart(2,"0"); }
function fmt(s){
  s = Math.ceil(s);
  return `${pad(Math.floor(s/60))}:${pad(s%60)}`;
}

function setButtonIcon(){
  btn.innerHTML = running
    ? '<div class="pause"><span></span><span></span></div>'
    : '<div class="play"></div>';
  btn.setAttribute("aria-label", running ? "Pause timer" : "Start timer");
}

function render(){
  const elapsed = TOTAL - remaining;
  const f = elapsed / TOTAL;

  timeEl.textContent = fmt(remaining);
  progress.style.strokeDasharray = CIRC;
  progress.style.strokeDashoffset = CIRC * (1 - f);
  orbit.style.transform = `rotate(${f * 360}deg)`;
}

function resetToMinutes(minutes){
  running = false;
  TOTAL = minutes * 60;
  remaining = TOTAL;
  lastWholeMinuteElapsed = 0;
  setButtonIcon();
  render();

  durationButtons.forEach(button => {
    button.classList.toggle("active", Number(button.dataset.min) === minutes);
  });
}

function initAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }
}

function softChime(){
  if(!chimeOn) return;
  initAudio();

  const now = audioCtx.currentTime;
  const master = audioCtx.createGain();
  master.gain.setValueAtTime(0.0001, now);
  master.gain.exponentialRampToValueAtTime(0.12, now + 0.03);
  master.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);
  master.connect(audioCtx.destination);

  [523.25, 783.99].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, now + i * 0.04);

    gain.gain.setValueAtTime(0.0001, now + i * 0.04);
    gain.gain.exponentialRampToValueAtTime(i === 0 ? 0.55 : 0.32, now + 0.06 + i * 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.25 + i * 0.05);

    osc.connect(gain);
    gain.connect(master);
    osc.start(now + i * 0.04);
    osc.stop(now + 1.5 + i * 0.05);
  });
}

function loop(now){
  const dt = (now - last) / 1000;
  last = now;

  if(running && remaining > 0){
    remaining = Math.max(0, remaining - dt);
    render();

    const elapsed = TOTAL - remaining;
    const wholeMinuteElapsed = Math.floor(elapsed / 60);

    if(chimeOn && wholeMinuteElapsed > lastWholeMinuteElapsed && wholeMinuteElapsed > 0 && remaining > 0){
      softChime();
    }
    lastWholeMinuteElapsed = wholeMinuteElapsed;

    if(remaining <= 0){
      running = false;
      setButtonIcon();
      softChime();
    }
  }

  requestAnimationFrame(loop);
}

btn.onclick = async () => {
  initAudio();

  if(!document.fullscreenElement && window.innerWidth <= 760){
    try { await document.documentElement.requestFullscreen(); } catch(e) {}
  }

  running = !running;
  setButtonIcon();
};

durationButtons.forEach(button => {
  button.onclick = () => resetToMinutes(Number(button.dataset.min));
});

document.getElementById("fs").onclick = async () => {
  if (!document.fullscreenElement) {
    try { await document.documentElement.requestFullscreen(); } catch(e) {}
  } else {
    try { await document.exitFullscreen(); } catch(e) {}
  }
};

chimeBtn.onclick = () => {
  chimeOn = !chimeOn;
  chimeBtn.classList.toggle("active", chimeOn);
  chimeBtn.textContent = chimeOn ? "♢" : "♡";
  if(chimeOn){
    initAudio();
    softChime();
  }
};

render();
requestAnimationFrame(loop);
</script>

</body>
</html>
